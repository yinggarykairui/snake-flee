<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>snake, flee — tests</title>
<link rel="icon" href="data:,"><!-- no favicon file; this stops the 404 -->
<link rel="stylesheet" href="style.css">
<style>
  /* Runner-only styling; the game's palette is reused for consistency. */
  .runner { max-width: 720px; margin: 0 auto; padding: 24px 16px; height: auto; }
  .summary { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
  .summary.ok { color: #2f5d33; }      /* 5.6:1 on the paper background */
  .summary.bad { color: var(--accent); }
  ol { margin: 0; padding-left: 22px; font-size: 14px; }
  li { margin: 2px 0; }
  li.fail { color: var(--accent); font-weight: 600; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  li.skip { color: var(--muted); }
  /* The shipped page, mounted and running (see mountPage). Off-screen, not
     display:none: the rows read rendered geometry and computed style, and a
     box that is not laid out has neither. The frame is sized here and resized
     by the rows that need a particular viewport, so the page under test never
     inherits the size of the window the suite was opened in. */
  .fixture { position: absolute; left: -20000px; top: 0; }
  #page { width: 560px; height: 640px; border: 0; display: block; }
</style>
</head>
<body>
<div class="runner">
  <h1 style="font-size:17px;margin:0 0 12px">snake, flee — assertions</h1>
  <p class="summary" id="summary">running…</p>
  <ol id="results"></ol>
</div>

<!-- The page under test is index.html itself, mounted here by mountPage()
     at the foot of this file. This used to be a hand-written copy of that
     file's chrome, and a copy is blind to the drift it was meant to catch:
     with only index.html edited, dropping role="status" from the overlay,
     rewriting the card's "a new best", and even renaming #canvas — which
     leaves the shipped page a dead board with no game on it — every one of
     them left this suite reading 168/168 green. -->
<div class="fixture" id="fixture"></div>

<script>
/* app.js reads the stored best once, at boot, so the seed has to be in place
   before the page under test loads — which is also why the key is spelled out
   here rather than read off the export. The record rows below need the stored
   best exactly one short of the winning score: a record taken in the frame the
   run ends is the case that reverted silently. The player's own value goes
   back at the end of the run (restoreBest). A private window throws here;
   loadBest reports 0 in that case and every row below still holds. */
window.__realBest = null;
window.__seeded = false;
try {
  window.__realBest = localStorage.getItem('snake-flee.best');
  localStorage.setItem('snake-flee.best', '397');
  window.__seeded = true;
} catch (e) { /* storage unavailable; nothing seeded, nothing to put back */ }
</script>
<!-- No #canvas in this document, so app.js boots nothing here: it is loaded
     for the pure logic it exports. The running game lives in the frame. -->
<script src="app.js"></script>
<script>
(function () {
  'use strict';
  var S = window.SnakeFlee;
  var pass = 0, fail = 0, skipped = 0;
  var list = document.getElementById('results');

  function ok(name, cond, detail) {
    var li = document.createElement('li');
    if (cond) { pass++; li.textContent = 'PASS  ' + name; }
    else { fail++; li.className = 'fail'; li.textContent = 'FAIL  ' + name + (detail ? ' — ' + detail : ''); }
    list.appendChild(li);
  }
  function eq(name, actual, expected) {
    ok(name, actual === expected, 'got ' + JSON.stringify(actual) + ', expected ' + JSON.stringify(expected));
  }
  /* A row that could not run, said out loud and counted apart. It is never a
     pass: a suite that quietly drops what it cannot check is worse than one
     that runs fewer rows, because the number at the top stops meaning what it
     says. The summary carries the count and so does the tab title. */
  function skip(name, why) {
    var li = document.createElement('li');
    li.className = 'skip';
    li.textContent = 'SKIP  ' + name + ' — ' + why;
    list.appendChild(li);
    skipped++;
  }
  var N = 20;
  function occ(cells) {
    var m = Object.create(null);
    for (var i = 0; i < cells.length; i++) m[S.key(cells[i][0], cells[i][1])] = true;
    return m;
  }

  // ---------------------------------------------------------------- wrapping
  eq('wrap(-1, 20) = 19', S.wrap(-1, 20), 19);
  eq('wrap(20, 20) = 0', S.wrap(20, 20), 0);
  eq('wrap(25, 20) = 5', S.wrap(25, 20), 5);
  eq('wrap(0, 20) = 0', S.wrap(0, 20), 0);

  // ---------------------------------------------------------- torus distance
  eq('torusDelta(1, 19, 20) = 2 (across the seam)', S.torusDelta(1, 19, 20), 2);
  eq('torusDelta(19, 1, 20) = -2', S.torusDelta(19, 1, 20), -2);
  eq('torusDelta(5, 3, 20) = 2 (no wrap)', S.torusDelta(5, 3, 20), 2);
  eq('torusDelta(0, 10, 20) = 10 (antipodal)', S.torusDelta(0, 10, 20), 10);
  eq('torusDist2 corner-to-corner (0,0)-(19,19) = 2', S.torusDist2(0, 0, 19, 19, N, N), 2);
  // (the naive, unwrapped answer for that pair would be 722; the row above is
  //  the whole assertion — a follow-up '!== 722' would only restate it)
  eq('torusDist2 antipodal on both axes (0,0)-(10,10) = 200', S.torusDist2(0, 0, 10, 10, N, N), 200);
  eq('torusDist2 one step across the seam (0,0)-(19,0) = 1', S.torusDist2(0, 0, 19, 0, N, N), 1);
  eq('torusDist2 symmetric', S.torusDist2(3, 17, 18, 2, N, N), S.torusDist2(18, 2, 3, 17, N, N));

  // --------------------------------------------------------------- flee step
  (function () {
    var far = S.fleeStep({ x: 0, y: 0 }, { x: 10, y: 10 }, {}, N, N, 5);
    ok('sits still outside the fear radius', far.x === 0 && far.y === 0, JSON.stringify(far));

    var near = S.fleeStep({ x: 8, y: 5 }, { x: 10, y: 5 }, {}, N, N, 5);
    ok('flees straight away from the head', near.x === 7 && near.y === 5, JSON.stringify(near));

    // Head at x=2, food at x=0: the short way round is through the seam, so
    // the food must exit left to x=19, not right into the snake.
    var seam = S.fleeStep({ x: 0, y: 5 }, { x: 2, y: 5 }, {}, N, N, 5);
    ok('flees across the wrap seam, not into the head', seam.x === 19 && seam.y === 5, JSON.stringify(seam));

    // Straight-line escape blocked by the snake body -> sidesteps, and the
    // tiebreak order (right, left, down, up) picks "down".
    var blocked = S.fleeStep({ x: 5, y: 5 }, { x: 7, y: 5 }, occ([[4, 5]]), N, N, 5);
    ok('refuses a snake cell and sidesteps', blocked.x === 5 && blocked.y === 6, JSON.stringify(blocked));

    // Fully boxed in: stays put rather than moving closer.
    var boxed = S.fleeStep({ x: 5, y: 5 }, { x: 6, y: 5 }, occ([[4, 5], [5, 4], [5, 6], [6, 5]]), N, N, 5);
    ok('boxed-in food holds its ground', boxed.x === 5 && boxed.y === 5, JSON.stringify(boxed));

    var diag = S.fleeStep({ x: 5, y: 5 }, { x: 7, y: 7 }, {}, N, N, 5);
    ok('diagonal tie breaks horizontally (left)', diag.x === 4 && diag.y === 5, JSON.stringify(diag));

    eq('radius boundary, explicit argument: distance 5 still scares it',
      S.fleeStep({ x: 5, y: 5 }, { x: 10, y: 5 }, {}, N, N, 5).x, 4);
    eq('radius boundary, explicit argument: distance 6 does not',
      S.fleeStep({ x: 5, y: 5 }, { x: 11, y: 5 }, {}, N, N, 5).x, 5);

    /* Every call above passes the radius explicitly, which exercises the
       parameter and never the constant the game actually ships. These three
       pin the shipped value and take the default-argument path — no sixth
       argument — so a change to FEAR_RADIUS is a failing test. */
    eq('the shipped fear radius is 5 cells', S.FEAR_RADIUS, 5);
    eq('default radius: distance 5 scares it',
      S.fleeStep({ x: 5, y: 5 }, { x: 10, y: 5 }, {}, N, N).x, 4);
    eq('default radius: distance 6 does not',
      S.fleeStep({ x: 5, y: 5 }, { x: 11, y: 5 }, {}, N, N).x, 5);
  })();

  // ------------------------------------------------------- food placement
  (function () {
    /* spawnFood's occupancy filter was untested: the game tests all inject an
       rng that lands on a free cell either way. Leave exactly one cell open
       and the filter is the only thing that can find it. */
    var g = S.createGame({ rng: function () { return 0; } });
    g.snake = [];
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) if (!(x === 7 && y === 3)) g.snake.push({ x: x, y: y });
    }
    var only = S.spawnFood(g);
    ok('food spawns in the one free cell, not on the snake',
      only.x === 7 && only.y === 3, JSON.stringify(only));

    // ...and across the whole rng range, with a body worth avoiding.
    var g2 = S.createGame({ rng: function () { return 0; } });
    g2.snake = [];
    for (var i = 0; i < N; i++) g2.snake.push({ x: i, y: 0 });   // the whole top row
    var taken = S.occupiedSet(g2.snake);
    var inside = 0, draws = 0;
    for (var k = 0; k <= 40; k++) {
      g2.rng = (function (v) { return function () { return v; }; })(k / 40.0001);
      var f = S.spawnFood(g2);
      draws++;
      if (taken[S.key(f.x, f.y)]) inside++;
    }
    eq('41 rng draws, none of them inside the snake', inside, 0);
    eq('...and all 41 draws actually happened', draws, 41);

    eq('occupiedSet marks the head cell too', S.occupiedSet([{ x: 1, y: 2 }, { x: 3, y: 4 }])[S.key(1, 2)], true);
    eq('occupiedSet marks the tail cell too', S.occupiedSet([{ x: 1, y: 2 }, { x: 3, y: 4 }])[S.key(3, 4)], true);
  })();

  // --------------------------------------------------- the vacating tail
  (function () {
    /* The tail cell frees up on the same step, so the head may follow it —
       unless the snake is growing this step, when the tail stays put and the
       same move is fatal. One guard, both outcomes. */
    function square(grow) {
      var g = S.createGame({ rng: function () { return 0; } });
      g.snake = [{ x: 5, y: 5 }, { x: 6, y: 5 }, { x: 6, y: 6 }, { x: 5, y: 6 }];
      g.dir = S.DIRS.down; g.dirMoved = S.DIRS.right;   // into the tail cell
      g.grow = grow; g.food = { x: 15, y: 15 }; g.clock = 0;
      return { r: S.tick(g), g: g };
    }
    var moving = square(0);
    eq('head into the cell the tail is vacating is a move', moving.r, 'move');
    eq('...and the run continues', moving.g.over, false);
    var growing = square(1);
    eq('the same move while growing is death', growing.r, 'dead');
    eq('...and the game is marked over', growing.g.over, true);
  })();

  // Exhaustive property sweep: for every head/food pair on the board the flee
  // step must stay on the grid, avoid occupied cells, never close the gap, and
  // never move at all when the head is outside the radius.
  (function () {
    var bad = { grid: 0, occupied: 0, closer: 0, restless: 0 };
    var block = occ([[9, 9], [9, 10], [10, 9], [3, 14], [17, 2]]);
    for (var hx = 0; hx < N; hx++) {
      for (var hy = 0; hy < N; hy++) {
        for (var fx = 0; fx < N; fx++) {
          for (var fy = 0; fy < N; fy++) {
            if (block[S.key(fx, fy)]) continue;
            var before = S.torusDist2(fx, fy, hx, hy, N, N);
            var r = S.fleeStep({ x: fx, y: fy }, { x: hx, y: hy }, block, N, N, 5);
            if (r.x < 0 || r.x >= N || r.y < 0 || r.y >= N || r.x % 1 || r.y % 1) bad.grid++;
            if (block[S.key(r.x, r.y)]) bad.occupied++;
            if (S.torusDist2(r.x, r.y, hx, hy, N, N) < before) bad.closer++;
            if (before > 25 && (r.x !== fx || r.y !== fy)) bad.restless++;
          }
        }
      }
    }
    eq('sweep: always lands on the grid', bad.grid, 0);
    eq('sweep: never lands on an occupied cell', bad.occupied, 0);
    eq('sweep: torus distance is non-decreasing', bad.closer, 0);
    eq('sweep: motionless outside the fear radius', bad.restless, 0);
  })();

  // ------------------------------------------------------------- reversals
  (function () {
    eq('right is opposite left', S.isOpposite(S.DIRS.right, S.DIRS.left), true);
    eq('up is opposite down', S.isOpposite(S.DIRS.up, S.DIRS.down), true);
    // One axis matching is not enough: 0 === -0, so every direction has one
    // component that looks reversed against itself.
    eq('down is not opposite itself', S.isOpposite(S.DIRS.down, S.DIRS.down), false);
    eq('left is not opposite itself', S.isOpposite(S.DIRS.left, S.DIRS.left), false);
    eq('right is not opposite up', S.isOpposite(S.DIRS.right, S.DIRS.up), false);
    (function () {
      var g = S.createGame({ rng: function () { return 0; } });
      g.food = { x: 0, y: 0 };
      eq('pressing the direction you are already going is legal',
        S.turn(g, S.DIRS.right), true);
    })();
  })();

  // ------------------------------------------------------------ flee cadence
  (function () {
    // The food moves once per two snake steps. At equal speed a head-on chase
    // never closes and the game cannot be won, so this cadence is what makes
    // the food catchable at all.
    var g = S.createGame({ rng: function () { return 0; } });
    g.snake = [{ x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }];
    g.dir = S.DIRS.right; g.dirMoved = S.DIRS.right; g.clock = 0;
    g.food = { x: 8, y: 10 };                        // 3 cells ahead, inside the radius
    S.tick(g);
    ok('food holds still on the first snake step', g.food.x === 8 && g.food.y === 10,
      JSON.stringify(g.food));
    S.tick(g);
    ok('food flees on the second snake step', g.food.x === 9 && g.food.y === 10,
      JSON.stringify(g.food));
    S.tick(g);
    eq('the chase closes: gap is now 1', S.torusDist2(g.food.x, g.food.y, g.snake[0].x, g.snake[0].y, N, N), 1);
    eq('a fleeing food can in fact be caught', S.tick(g), 'eat');
  })();

  (function () {
    /* Eating restarts the cadence clock, so the new food gets a step of grace
       instead of inheriting the old food's parity. */
    var g = S.createGame({ rng: function () { return 0; } });
    g.snake = [{ x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }];
    g.dir = S.DIRS.right; g.dirMoved = S.DIRS.right;
    g.clock = 1;                    // one more step and the food would move
    g.food = { x: 6, y: 10 };       // directly ahead: this step is the meal
    eq('the meal reports eat', S.tick(g), 'eat');
    g.food = { x: 9, y: 10 };       // 3 cells ahead, well inside the radius
    S.tick(g);
    ok('the food holds still on the step after a meal (the clock restarted)',
      g.food.x === 9 && g.food.y === 10, JSON.stringify(g.food));
    S.tick(g);
    ok('...and flees on the step after that',
      g.food.x === 10 && g.food.y === 10, JSON.stringify(g.food));
  })();

  (function () {
    // Sharing one coordinate with the food is not a meal.
    var g = S.createGame({ rng: function () { return 0; } });
    g.snake = [{ x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }];
    g.dir = S.DIRS.right; g.dirMoved = S.DIRS.right; g.clock = 0;
    g.food = { x: 6, y: 11 };       // same column as the next head cell, one row off
    eq('passing under the food is not a meal', S.tick(g), 'move');
    eq('...and the score does not move', g.score, 0);
    g.snake = [{ x: 5, y: 10 }, { x: 4, y: 10 }, { x: 3, y: 10 }];
    g.dir = S.DIRS.right; g.dirMoved = S.DIRS.right;
    g.food = { x: 6, y: 10 };       // the same step, this time on the food
    eq('landing on it is', S.tick(g), 'eat');
  })();

  // -------------------------------------------------------------- speed ramp
  eq('ramp: 165 ms/step at score 0', S.stepIntervalMs(0), 165);
  eq('ramp: -4 ms per point', S.stepIntervalMs(1), 161);
  eq('ramp: 85 ms at score 20', S.stepIntervalMs(20), 85);
  eq('ramp: 81 ms at score 21', S.stepIntervalMs(21), 81);
  eq('ramp: floor of 80 ms reached at score 22', S.stepIntervalMs(22), 80);
  eq('ramp: never below the floor', S.stepIntervalMs(10000), 80);
  (function () {
    var monotone = true;
    for (var i = 1; i <= 200; i++) {
      if (S.stepIntervalMs(i) > S.stepIntervalMs(i - 1)) monotone = false;
    }
    ok('ramp: monotonically non-increasing', monotone);
  })();

  // ------------------------------------------------------------ game stepping
  (function () {
    var g = S.createGame({ rng: function () { return 0.5; } });
    eq('fresh game: score 0', g.score, 0);
    eq('fresh game: 3 segments', g.snake.length, 3);

    // Park the food directly ahead so the next step eats it.
    g.food = { x: g.snake[0].x + 1, y: g.snake[0].y };
    var len = g.snake.length;
    eq('eating reports "eat"', S.tick(g), 'eat');
    eq('eating adds exactly one point', g.score, 1);
    eq('eating grows by exactly one segment', g.snake.length, len + 1);
    var len2 = g.snake.length;
    g.food = { x: 0, y: 0 };            // far away, no second meal
    S.tick(g);
    eq('length is stable after the growth step', g.snake.length, len2);
  })();

  (function () {
    var g = S.createGame({ rng: function () { return 0; } });
    g.snake = [{ x: 19, y: 4 }, { x: 18, y: 4 }, { x: 17, y: 4 }];
    g.dir = S.DIRS.right; g.dirMoved = S.DIRS.right;
    g.food = { x: 10, y: 15 };
    S.tick(g);
    ok('snake wraps off the right edge to column 0', g.snake[0].x === 0 && g.snake[0].y === 4,
      JSON.stringify(g.snake[0]));

    g.snake = [{ x: 6, y: 0 }, { x: 6, y: 1 }, { x: 6, y: 2 }];
    g.dir = S.DIRS.up; g.dirMoved = S.DIRS.up;
    S.tick(g);
    ok('snake wraps off the top edge to the last row', g.snake[0].x === 6 && g.snake[0].y === 19,
      JSON.stringify(g.snake[0]));
  })();

  // -------------------------------------------------------------- the win
  (function () {
    /* Filling the board is 397 meals on a 20x20, so nobody will ever reach it
       by playing — which is exactly why it has to be asserted. It used to end
       the run as a death: with no free cell left spawnFood handed back the
       stale food, that cell was the head, and the next step was a collision
       with yourself. Build the board one cell short and eat the last one. */
    function full() {
      var g = S.createGame({ rng: function () { return 0; } });
      var snake = [{ x: 7, y: 4 }];                 // head, about to move up
      for (var y = 0; y < N; y++) {
        for (var x = 0; x < N; x++) {
          if (x === 7 && (y === 3 || y === 4)) continue;   // (7,3) is the gap
          snake.push({ x: x, y: y });
        }
      }
      g.snake = snake;
      g.grow = 0;
      g.score = N * N - 3;
      g.dir = S.DIRS.up; g.dirMoved = S.DIRS.up;
      g.food = { x: 7, y: 3 };
      return g;
    }

    var g = full();
    eq('the board is one cell short of full', g.snake.length, N * N - 1);
    eq('eating the last free cell is a win, not a death', S.tick(g), 'win');
    eq('...and the snake fills the board', g.snake.length, N * N);
    eq('...and the meal still scored', g.score, N * N - 2);
    eq('...the run is over', g.over, true);
    eq('...and it is marked won', g.won, true);
    eq('a won game stays won and never reports dead', S.tick(g), 'win');
    eq('a won game refuses to steer, like any finished run',
      S.turn(g, S.DIRS.left), false);

    // The win is a state of its own: a fresh game and a death are not it.
    var fresh = S.createGame({ rng: function () { return 0; } });
    eq('a fresh game has not won', fresh.won, false);
    S.reset(g);
    eq('reset clears the win', g.won, false);
    eq('reset revives a won game', g.over, false);

    var d = S.createGame({ rng: function () { return 0; } });
    d.snake = [{ x: 5, y: 5 }, { x: 6, y: 5 }, { x: 6, y: 6 }, { x: 5, y: 6 }, { x: 4, y: 6 }];
    d.dir = S.DIRS.down; d.dirMoved = S.DIRS.left;
    d.food = { x: 15, y: 15 };
    eq('death is still death', S.tick(d), 'dead');
    eq('...and a death is not a win', d.won, false);

    /* One cell short of full is an ordinary meal, so the win is the board
       filling and not merely a long snake. Two cells free, eat one. */
    var g2 = full();
    g2.snake.pop();                 // give a second cell back to the board
    eq('two cells free: the same meal is an ordinary eat', S.tick(g2), 'eat');
    eq('...and the run continues', g2.over, false);
    eq('...and nothing is won', g2.won, false);
  })();

  (function () {
    // Self-collision: a length-5 snake turned into its own body.
    var g = S.createGame({ rng: function () { return 0; } });
    g.snake = [{ x: 5, y: 5 }, { x: 6, y: 5 }, { x: 6, y: 6 }, { x: 5, y: 6 }, { x: 4, y: 6 }];
    g.dir = S.DIRS.down; g.dirMoved = S.DIRS.left;
    g.food = { x: 15, y: 15 };
    eq('running into the body ends the run', S.tick(g), 'dead');
    eq('a dead game stays dead', S.tick(g), 'dead');

    S.reset(g);
    eq('reset clears the score', g.score, 0);
    eq('reset restores the starting length', g.snake.length, 3);
    eq('reset restores the starting speed', S.stepIntervalMs(g.score), 165);
    eq('reset revives the game', g.over, false);
  })();

  (function () {
    // A 180 is judged against the direction last *moved*. Moving right, the
    // pair (up, left) in one tick must leave "up" queued, not "left".
    var g = S.createGame({ rng: function () { return 0; } });
    g.food = { x: 0, y: 0 };
    eq('reversal straight into the neck is refused', S.turn(g, S.DIRS.left), false);
    eq('a legal turn is accepted', S.turn(g, S.DIRS.up), true);
    eq('the follow-up reversal is still judged against the last move',
      S.turn(g, S.DIRS.left), false);
    ok('the refused reversal is not fatal', S.tick(g) !== 'dead');
    eq('the queued turn is the one that happened', g.dirMoved, S.DIRS.up);
    eq('after moving up, left is now legal', S.turn(g, S.DIRS.left), true);
    g.over = true;
    eq('a finished run refuses to steer', S.turn(g, S.DIRS.right), false);
  })();

  (function () {
    // Mash every direction 500 times from a fresh game: nothing may throw and
    // the snake may never reverse into itself on the very next step.
    var g = S.createGame({ rng: Math.random });
    var dirs = [S.DIRS.up, S.DIRS.down, S.DIRS.left, S.DIRS.right];
    var threw = false, reversed = false;
    try {
      for (var i = 0; i < 500; i++) {
        var moved = g.dirMoved;
        S.turn(g, dirs[i % 4]);
        S.turn(g, dirs[(i * 7 + 3) % 4]);
        if (S.isOpposite(g.dir, moved)) reversed = true;
        if (S.tick(g) === 'dead') S.reset(g);
      }
    } catch (e) { threw = true; }
    ok('key mashing never throws', !threw);
    ok('key mashing never queues a reversal', !reversed);
  })();

  // ----------------------------------------------------------- best storage
  eq('decode "NaN" -> 0', S.decodeBest('NaN'), 0);
  eq('decode "{}" -> 0', S.decodeBest('{}'), 0);
  eq('decode "-5" -> 0', S.decodeBest('-5'), 0);
  eq('decode "3.5" -> 0', S.decodeBest('3.5'), 0);
  eq('decode "" -> 0', S.decodeBest(''), 0);
  eq('decode null (nothing stored) -> 0', S.decodeBest(null), 0);
  eq('decode a 10 kB blob -> 0', S.decodeBest(new Array(10241).join('9')), 0);
  /* The blob row cannot tell the length guard from anything else: Number() of
     ten thousand nines is Infinity, which the value guards catch on their own.
     A 13-character string worth 42 is the input that isolates it. */
  eq('decode "0000000000042" (13 chars) -> 0', S.decodeBest('0000000000042'), 0);
  eq('decode "000000000042" (12 chars) -> 42', S.decodeBest('000000000042'), 42);
  // Number() would take all of these; the comment says plain integers only.
  eq('decode "0x10" -> 0', S.decodeBest('0x10'), 0);
  eq('decode "1e5" -> 0', S.decodeBest('1e5'), 0);
  eq('decode " 9 " -> 0', S.decodeBest(' 9 '), 0);
  eq('decode "+5" -> 0', S.decodeBest('+5'), 0);
  eq('decode "5.0" -> 0', S.decodeBest('5.0'), 0);
  eq('decode "0b11" -> 0', S.decodeBest('0b11'), 0);
  eq('decode "0o17" -> 0', S.decodeBest('0o17'), 0);
  // The ceiling is inclusive, and one past it is not.
  eq('decode "1000000" (the ceiling) -> 1000000', S.decodeBest('1000000'), 1000000);
  eq('decode "1000001" -> 0', S.decodeBest('1000001'), 0);
  eq('decode "9999999" -> 0', S.decodeBest('9999999'), 0);
  eq('decode "Infinity" -> 0', S.decodeBest('Infinity'), 0);
  eq('decode a legitimate "42" -> 42', S.decodeBest('42'), 42);
  eq('decode "0" -> 0', S.decodeBest('0'), 0);

  (function () {
    /* Storage is not always reachable: a private window, a browser with site
       data off, a third-party frame. The game is fine there — it plays, the
       best reads 0, nothing throws — so the suite has to be fine there too.
       This block used to call ok(false) on the throw, which failed one row of
       145 in a mode the build itself handles, and made the README's count
       false the moment anyone opened the file in a private window.
       Probe once, assert whichever branch applies, three rows either way. */
    var PROBE = S.BEST_KEY + '.probe';
    var available = true;
    var stored = null;
    try {
      stored = localStorage.getItem(S.BEST_KEY);
      localStorage.setItem(PROBE, '1');
      localStorage.removeItem(PROBE);
    } catch (e) { available = false; }

    if (available) {
      localStorage.setItem(S.BEST_KEY, '{"best":7}');
      eq('a garbage stored value loads as 0', S.loadBest(), 0);
      localStorage.setItem(S.BEST_KEY, '137');
      eq('a legitimate stored value still loads', S.loadBest(), 137);
      S.saveBest(58);
      eq('saved best round-trips', S.loadBest(), 58);
      if (stored === null) localStorage.removeItem(S.BEST_KEY);
      else localStorage.setItem(S.BEST_KEY, stored);
    } else {
      var threw = false;
      try { S.saveBest(58); } catch (e) { threw = true; }
      /* Through a catch, because the thing under test is that neither call
         throws. Read straight, a loadBest that had lost its own try/catch
         threw out of this block and took the rest of the file with it: the
         page sat on "running…" with no count and no failing row, which is the
         one result a suite must never produce. */
      function load() { try { return S.loadBest(); } catch (e) { return e.name; } }
      eq('storage unavailable: loadBest reports no best', load(), 0);
      ok('storage unavailable: saveBest swallows it and the run carries on', !threw);
      eq('storage unavailable: still no best after a save', load(), 0);
    }
  })();

  // ------------------------------------------------------------ key mapping
  /* Every entry in the table, one row each. Three of the twelve were asserted
     and the other nine were not, so deleting KEYMAP.W — shift held on WASD,
     which is how anyone steering with a hand on shift actually types it — left
     the suite at a clean pass. A mapping is only as covered as its rows. */
  eq('keyDir("ArrowUp") -> up', S.keyDir('ArrowUp'), 'up');
  eq('keyDir("ArrowDown") -> down', S.keyDir('ArrowDown'), 'down');
  eq('keyDir("ArrowLeft") -> left', S.keyDir('ArrowLeft'), 'left');
  eq('keyDir("ArrowRight") -> right', S.keyDir('ArrowRight'), 'right');
  eq('keyDir("w") -> up', S.keyDir('w'), 'up');
  eq('keyDir("a") -> left', S.keyDir('a'), 'left');
  eq('keyDir("s") -> down', S.keyDir('s'), 'down');
  eq('keyDir("d") -> right', S.keyDir('d'), 'right');
  eq('keyDir("W") -> up', S.keyDir('W'), 'up');
  eq('keyDir("A") -> left', S.keyDir('A'), 'left');
  eq('keyDir("S") -> down', S.keyDir('S'), 'down');
  eq('keyDir("D") -> right', S.keyDir('D'), 'right');
  eq('keyDir("q") -> null', S.keyDir('q'), null);
  eq('keyDir("__proto__") -> null', S.keyDir('__proto__'), null);
  eq('keyDir("constructor") -> null', S.keyDir('constructor'), null);
  eq('keyDir("toString") -> null', S.keyDir('toString'), null);
  eq('keyDir(undefined) -> null', S.keyDir(undefined), null);

  // A keydown carrying ctrl/meta/alt belongs to the browser, not to the game.
  eq('a bare key is ours', S.isBareKey({}), true);
  eq('shift is still ours', S.isBareKey({ shiftKey: true }), true);
  eq('ctrl is not', S.isBareKey({ ctrlKey: true }), false);
  eq('meta is not', S.isBareKey({ metaKey: true }), false);
  eq('alt is not', S.isBareKey({ altKey: true }), false);

  /* ------------------------------------------------- the rendered chrome
     Everything above is pure logic, and that is how six of day 042's changes
     could be reverted one at a time with the suite still reading 145/145: a
     flag can be correct while what the player sees is wrong.

     What these rows drive is the shipped page. index.html is mounted in a
     frame and the game booted inside it is the one under test — its markup,
     its stylesheet, its copy. The suite kept a hand-written copy of that
     chrome until day 042, which left it blind to exactly the drift it exists
     to catch: three edits to index.html alone — dropping role="status" from
     the overlay, rewriting the card's "a new best", renaming #canvas so the
     page has no game at all — each left the suite green.

     The frame is also what makes the geometry rows repeatable. They read the
     page at a size this file sets, so the answer no longer depends on the
     window the suite is opened in. It used to: below about 370 px of runner
     height, chooseLayout() put the old fixture into the row arrangement,
     where max-width is none and nothing clamped the board, and the clamp row
     failed — 167/168 on an ordinary laptop with a short window, 168/168 on a
     tall one, from the same commit.

     They are asynchronous: the page loads, then the game advances on
     requestAnimationFrame, so the summary is written by finish() at the end
     of the chain. */
  var PAGE_W = 560;   // the frame's own viewport, in CSS px
  var frame = null, iw = null, idoc = null;
  var live, overlay, oTitle, oLine, oRecord, markEl, canvasEl, stageEl;

  function restoreBest() {
    if (!window.__seeded) return;
    try {
      if (window.__realBest === null) localStorage.removeItem(S.BEST_KEY);
      else localStorage.setItem(S.BEST_KEY, window.__realBest);
    } catch (e) { /* it was reachable a moment ago; nothing to do if it is not */ }
  }

  /* One way out, whatever happens. The rows below run inside the frame's
     animation frames and a frame that stops — a browser that throttles an
     off-screen document, a page that never boots — would otherwise leave the
     suite sitting on "running…" for ever: no count, no failing row, nothing
     to read. The watchdog turns that into a failure like any other. */
  var finished = false;
  var watchdog = setTimeout(function () {
    ok('the page under test keeps stepping', false,
      'the chain stalled: no animation frame from the page in 60 s');
    finish();
  }, 60000);

  function finish() {
    if (finished) return;
    finished = true;
    clearTimeout(watchdog);
    restoreBest();
    var summary = document.getElementById('summary');
    summary.textContent = pass + ' passed, ' + fail + ' failed' +
      (skipped ? ', ' + skipped + ' skipped' : '');
    summary.className = 'summary ' + (fail === 0 ? 'ok' : 'bad');
    document.title = (fail === 0 ? 'PASS' : 'FAIL') + ' — ' + pass + '/' + (pass + fail) +
      (skipped ? ' (' + skipped + ' skipped)' : '');
    window.__testResults = { pass: pass, fail: fail, skipped: skipped };
  }

  /* index.html, loaded and running. Same origin over http(s), so the page's
     own window is readable and every row below reads the real thing.
     Over file:// it is not: a sibling file is a separate origin in Chrome and
     Safari, and the frame's document is closed to this page. There is nothing
     honest to assert then, so the block says out loud that it did not run
     rather than passing on a copy of the page that could already have drifted
     from it. Serving the folder is the fix, and the message says so. */
  function mountPage(cb) {
    var settled = false;
    function done(w) { if (settled) return; settled = true; cb(w); }
    frame = document.createElement('iframe');
    frame.id = 'page';
    frame.title = 'index.html, under test';
    frame.addEventListener('load', function () {
      var w = null;
      try {
        w = frame.contentWindow;
        if (!w || !w.document || !w.document.getElementById) w = null;
      } catch (e) { w = null; }   // cross-origin: file:// is the usual reason
      done(w);
    });
    frame.addEventListener('error', function () { done(null); });
    // src before insertion: a frame appended empty fires load once for the
    // about:blank it starts on, and that one is not the page under test.
    frame.src = 'index.html';
    document.getElementById('fixture').appendChild(frame);
    // A frame that never loads must not leave the suite reading "running…".
    setTimeout(function () { done(null); }, 10000);
  }

  // Every wait is on the frame's own clock: the game steps there, not here.
  function press(k) { iw.dispatchEvent(new iw.KeyboardEvent('keydown', { key: k })); }
  function frames(n, cb) {
    if (n <= 0) { cb(); return; }
    iw.requestAnimationFrame(function () { frames(n - 1, cb); });
  }
  // The game steps on its own clock, so wait for the state rather than for a
  // fixed number of frames. 600 frames is ten seconds of budget for a step
  // that takes five.
  function until(pred, cb, budget) {
    if (budget === undefined) budget = 600;
    if (pred()) { cb(true); return; }
    if (budget <= 0) { cb(false); return; }
    iw.requestAnimationFrame(function () { until(pred, cb, budget - 1); });
  }
  function shown(el) {
    return !el.hidden && iw.getComputedStyle(el).display !== 'none';
  }
  // The page under test at a viewport this file chooses. Three frames: one to
  // take the resize, one for layout() to re-pick the arrangement, one to paint.
  function width(px, cb) {
    frame.style.width = px + 'px';
    frames(3, cb);
  }
  // One cell centre of the live board, as the browser actually painted it.
  function pixelAt(cx, cy) {
    var cell = canvasEl.width / N;
    var d = canvasEl.getContext('2d')
      .getImageData(Math.round((cx + 0.5) * cell), Math.round((cy + 0.5) * cell), 1, 1).data;
    return '#' + [d[0], d[1], d[2]].map(function (v) {
      return ('0' + v.toString(16)).slice(-2);
    }).join('');
  }
  // How far the card's lines reach outside the board they are anchored to,
  // in px, on any side. 0 is the whole of the requirement.
  function cardSpill() {
    var st = stageEl.getBoundingClientRect();
    var ps = idoc.querySelectorAll('#overlay > p');
    var out = 0;
    for (var i = 0; i < ps.length; i++) {
      var el = ps[i];
      if (!shown(el) || !el.textContent.trim()) continue;
      var r = el.getBoundingClientRect();
      out = Math.max(out, st.top - r.top, r.bottom - st.bottom,
        st.left - r.left, r.right - st.right);
    }
    return Math.round(out);
  }
  // The page's own horizontal overflow, both directions: scrollWidth catches
  // what hangs off the right, and the left edge of a centred row that no
  // longer fits is not scrollable at all, so it is measured directly.
  function offPage(sel) {
    var el = idoc.querySelector(sel), r = el.getBoundingClientRect();
    var w = idoc.documentElement.clientWidth;
    return Math.round(Math.max(0, -r.left, r.right - w));
  }

  // The board one cell short of full, head about to take the last free cell.
  // Score is the seeded best, so the record is taken in the frame that ends
  // the run — the case commitBest used to eat before anything could read it.
  function loadAlmostFull(g) {
    var snake = [{ x: 7, y: 4 }];
    for (var y = 0; y < N; y++) {
      for (var x = 0; x < N; x++) {
        if (x === 7 && (y === 3 || y === 4)) continue;
        snake.push({ x: x, y: y });
      }
    }
    g.snake = snake; g.grow = 0; g.score = N * N - 3;
    g.dir = iw.SnakeFlee.DIRS.up; g.dirMoved = iw.SnakeFlee.DIRS.up;
    g.food = { x: 7, y: 3 }; g.clock = 0; g.over = false; g.won = false;
  }

  // A run that dies into its own body, at whatever score is already set.
  function loadDeath(g) {
    g.snake = [{ x: 5, y: 5 }, { x: 6, y: 5 }, { x: 6, y: 6 }, { x: 5, y: 6 }, { x: 4, y: 6 }];
    g.dir = iw.SnakeFlee.DIRS.down; g.dirMoved = iw.SnakeFlee.DIRS.left;
    g.food = { x: 15, y: 15 };
  }

  mountPage(function (w) {
    if (!w) {
      skip('the shipped page, mounted and driven',
        'index.html cannot be read from here — over file:// a sibling file is a ' +
        'separate origin, so the frame holding the page is closed to this suite. ' +
        'Every row that drives the real page — all of them, below this one — ' +
        'did not run. Serve the folder (python3 -m http.server) and reload ' +
        'to run them.');
      finish();
      return;
    }
    iw = w; idoc = w.document;
    var G = iw.SnakeFlee;

    /* The first row is the coupling itself. app.js wires the renderer up only
       when the page has a #canvas, so a page that boots a game is a page with
       a board on it; renaming that one attribute leaves a dead board and no
       game, and the suite used to call that 168/168. */
    ok('index.html boots a game on a board of its own',
      !!(G && G.game && idoc.getElementById('canvas')),
      'canvas=' + !!idoc.getElementById('canvas') + ' game=' + !!(G && G.game));
    if (!G || !G.game) { finish(); return; }   // nothing below can mean anything

    live = idoc.getElementById('live');
    overlay = idoc.getElementById('overlay');
    oTitle = idoc.getElementById('overlayTitle');
    oLine = idoc.getElementById('overlayLine');
    oRecord = idoc.getElementById('overlayRecord');
    markEl = idoc.querySelector('#bestSlot .mark');
    canvasEl = idoc.getElementById('canvas');
    stageEl = idoc.getElementById('stage');

    /* 0. Warm-up: leave the best exactly one under the winning score. The seed
          before the frame loads does that when storage is reachable; when it is
          not, boot read 0 and this run is what raises it. Either way the record
          in step 1 is taken in the frame the run ends, which is the case that
          reverted silently — not one taken a meal earlier. */
    frames(2, function () {
      var g = G.game;
      press('p');            // starts the run without steering it
      g.score = N * N - 3;   // 397, one under the score that fills the board
      loadDeath(g);
      until(function () { return g.over; }, function (warmed) {
        ok('the warm-up run ends and banks its score', warmed);
        press('r');

    // 1. A win that takes the record in the frame it ends.
    loadAlmostFull(g);
    until(function () { return g.over; }, function (reached) {
      ok('the board fills and the run ends', reached);
      frames(2, function () {
        eq('a win draws the win card, not the death card', oTitle.textContent, 'you win');
        ok('the win card is on the board', shown(overlay), overlay.outerHTML.slice(0, 60));
        eq('the win card is a live region, so it announces itself',
          overlay.getAttribute('role'), 'status');
        ok('the win card states the best', /best\s+\d+/.test(oLine.textContent), oLine.textContent);
        ok('a record win shows the record line', shown(oRecord),
          'hidden=' + oRecord.hidden + ' display=' + iw.getComputedStyle(oRecord).display);
        ok('...and the line says it in words', /a new best/.test(oRecord.textContent),
          JSON.stringify(oRecord.textContent));
        // The star is the second channel; the words beside it are the first,
        // so a reader must not hear "black star" on top of them.
        eq('...and its star is hidden from the reader, like the HUD’s',
          oRecord.querySelector('span').getAttribute('aria-hidden'), 'true');
        eq('...and the HUD star is visible', iw.getComputedStyle(markEl).visibility, 'visible');
        // A filled board of ink is the only payoff this game has; 93% paper
        // over it turns that into a faint grey checker.
        eq('the win card does not veil the board it is congratulating',
          iw.getComputedStyle(overlay).backgroundColor, 'rgba(0, 0, 0, 0)');
        ok('the live region carries the record', /best/.test(live.textContent),
          JSON.stringify(live.textContent));
        ok('...and does not repeat the card, so the win is announced once',
          live.textContent.indexOf('you win') === -1, JSON.stringify(live.textContent));
        ok('the winning frame paints no food on the full board',
          pixelAt(7, 3) !== '#a83c1b', pixelAt(7, 3));

        /* 1a. The same card at 160 px of viewport — a 320 px phone at 200%
               page zoom. The card is anchored to the board and its copy has to
               stay there: it used to reach 75 px below it, across both pills,
               with the plate over the tagline and the scores. */
        width(160, function () {
          eq('the win card stays on the board at a 160 px page', cardSpill(), 0);
          eq('...and the scores stay on the page beside it', offPage('.scores'), 0);
          eq('...and so does the pause pill', offPage('#pauseBtn'), 0);
          eq('...and the restart pill', offPage('#restartBtn'), 0);
          width(PAGE_W, function () {

        // 2. A death that takes the record. The best is now the winning
        //    score, so score above it and run into the body.
        press('r');
        loadDeath(g);
        g.score = N * N + 100;
        until(function () { return g.over; }, function (died) {
          ok('the record run ends', died);
          frames(2, function () {
            eq('a record death still draws the death card', oTitle.textContent, 'game over');
            ok('a record death shows the record line', shown(oRecord),
              'hidden=' + oRecord.hidden);
            ok('...and the line says it in words', /a new best/.test(oRecord.textContent),
              JSON.stringify(oRecord.textContent));
            eq('...and the HUD star is visible', iw.getComputedStyle(markEl).visibility, 'visible');

            // 3. A death that takes nothing. The same card, quiet.
            press('r');
            loadDeath(g);
            until(function () { return g.over; }, function (died2) {
              ok('the ordinary run ends', died2);
              frames(2, function () {
                ok('an ordinary death says nothing about a best', !shown(oRecord),
                  'hidden=' + oRecord.hidden);
                eq('...and the HUD star is not showing',
                  iw.getComputedStyle(markEl).visibility, 'hidden');

                // 3a. The card every player reaches, at the same 160 px.
                width(160, function () {
                  eq('the game-over card stays on the board at a 160 px page',
                    cardSpill(), 0);
                  eq('...and nothing on the page hangs off it sideways',
                    idoc.documentElement.scrollWidth,
                    idoc.documentElement.clientWidth);

                // 4. The board is square at a width the column has to clamp.
                //    130 px of page leaves 98 px of column, under the 160 px
                //    floor the layout asks for, so max-width cuts the width
                //    and the height has to follow it. The frame sets that
                //    width, so this row reads the same on any window.
                width(130, function () {
                  var r = canvasEl.getBoundingClientRect();
                  var w2 = Math.round(r.width), h2 = Math.round(r.height);
                  ok('the clamp bites: the board is narrower than the 160 px floor',
                    w2 > 0 && w2 < 160, w2 + 'px');
                  ok('the board is still square under the clamp', w2 === h2, w2 + 'x' + h2);
                  eq('...because the height follows the width, by rule',
                    iw.getComputedStyle(canvasEl).aspectRatio, '1 / 1');
                  width(PAGE_W, finish);
                });
                });
              });
            });
          });
        });
          });
        });
      });
    });
      });
    });
  });
})();
</script>
</body>
</html>
