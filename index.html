<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>snake, flee — the food runs away</title>
<link rel="icon" href="data:,"><!-- no favicon file; this stops the 404 -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="hud">
    <div class="titles">
      <h1 class="title">snake<span class="title-dim">, flee</span></h1>
      <!-- The twist, on the page and not only in the <title>: a screenshot or
           an embed has to say what this is. -->
      <p class="tagline">the food runs away from you.</p>
    </div>
    <div class="scores">
      <span class="score"><span class="label">score</span> <b id="score">0</b></span>
      <span class="score" id="bestSlot"><span class="label">best</span> <b id="best">0</b></span>
    </div>
  </header>

  <div class="board" id="board">
    <div class="stage" id="stage">
      <canvas id="canvas" width="480" height="480" aria-label="Snake board"></canvas>
      <div class="overlay" id="overlay" hidden>
        <p class="over-title" id="overlayTitle">paused</p>
        <p class="over-line" id="overlayLine"></p>
        <p class="over-hint" id="overlayHint"></p>
      </div>
    </div>
  </div>

  <footer class="foot">
    <div class="controls">
      <button class="btn" id="pauseBtn" type="button">pause</button>
      <button class="btn" id="restartBtn" type="button">restart</button>
    </div>
    <p class="hint">arrows / wasd to steer &middot; p or space to pause &middot; r to restart</p>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
